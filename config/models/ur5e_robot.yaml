# Classical joint friction
# 'viscous' are the diagonal viscous coefficients F_v [Nm*s/rad] and 'coulomb'
# are the Coulomb/static friction torques F_s [Nm]. Omitted joints default to 0.
friction:
  joint_1:
    viscous: 0.0
    coulomb: 0.0
  joint_2:
    viscous: 0.0
    coulomb: 0.0
  joint_3:
    viscous: 0.0
    coulomb: 0.0
  joint_4:
